version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CATALOG_SOURCE: ${CATALOG_SOURCE}
      JOBS_SOURCE: ${JOBS_SOURCE}
    volumes:
      - ..:/app
      - /app/node_modules
    command: sh -c "npm install && npm run build -w @apex/api && npm run start -w @apex/api"
    ports:
      - "${API_PORT}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    volumes:
      - ..:/app
      - /app/node_modules
    command: sh -c "npm install && npm run build -w @apex/web && npm run start -w @apex/web"
    ports:
      - "${WEB_PORT}:8004"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
