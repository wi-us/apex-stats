# === NEW BASELINE (победитель прогона 0-600s: 11384 tracked frames) ===
# Detect-first, COLOR-приоритет: запрещаем кросс-цветовой ассайн,
# доверяем цветовой принадлежности кандидата сильнее, чем калману.
# Особо силён на slot_10 (+20pp vs detect_first).
canonical_map: storm_point
frame_step: 60
anchors_file: ../../motion_detect/reports/motion_tracks.json
eliminations_file: ../../hud_read/reports/eliminations.json
zones_file: ../../../configs/zones.vod.json

da_strategy: detect_first
da_weights:
  beta_world: 0.5
  gamma_shape: 0.3
  delta_color_mismatch: 5.0   # фактически блокирует чужой цвет
  eps_hysteresis: 0.3
  gate_radius_mult: 1.4
  fallback_gate_canonical_px: 250.0
  slot_overrides:
    # slot_11: 6 id-switches в baseline (179/300/420/540s) —
    # путается с slot_9/12/15/17. Дополнительно сжимаем gate и поднимаем
    # инерцию ассайна, цветовой блок наследуется (δ=5).
    slot_11:
      delta_color_mismatch: 10.0
      gate_radius_mult: 0.6
      eps_hysteresis: 0.5
    # slot_20: 6 id-switches (300/419s) — путается со slot_6/7.
    slot_20:
      delta_color_mismatch: 10.0
      gate_radius_mult: 0.6
      eps_hysteresis: 0.5

registration: { detector: sift, max_features: 4000, clahe: true, canonical_target_w: 1600,
                match_ratio: 0.75, ransac_reproj_px: 5.0, min_inliers: 15,
                roi: [0.21875, 0.0, 0.78125, 1.0] }
detection: { min_area_px: 40, max_area_px: 2400, morph_kernel: 3 }
slot_tracker: { roi_size: 220, min_tracked_for_active: 20, min_tracked_ratio_for_active: 0.20,
                near_anchor_radius_canonical_px: 120.0 }
tracking:
  max_gap_frames: 30
  gating_world_dist: 50.0
  process_noise: 1.0
  measurement_noise: 4.0
  # init-warmup: до приземления (~30c) не создаём треки в кромке карты
  # и игнорим слабые детекты — фикс для команд, "стартующих в углу".
  init_warmup_sec: 30.0
  init_reject_world_margin: 30.0
  init_min_score: 0.4

# Late-game collision protection: median pairwise canonical_px < threshold
# -> временно режем gate всем слотам. Фикс эпизода ~660s.
late_game:
  enabled: true
  t_min_sec: 300.0
  cluster_threshold_px: 250.0
  gate_shrink: 0.4

da_debug_near_miss: true
