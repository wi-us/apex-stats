# Detect-first → associate (новый пайплайн). Базовые веса.
canonical_map: storm_point
frame_step: 60
anchors_file: ../../motion_detect/reports/motion_tracks.json
eliminations_file: ../../hud_read/reports/eliminations.json
zones_file: ../../../configs/zones.vod.json

da_strategy: detect_first
da_weights:
  beta_world: 1.0           # вес расстояния до предсказания
  gamma_shape: 0.3          # штраф за низкий color_score (рыхлый blob)
  delta_color_mismatch: 0.5 # стоимость кросс-цветового ассайна
  eps_hysteresis: 0.2       # скидка прежнему ассайну
  gate_radius_mult: 1.0
  fallback_gate_canonical_px: 200.0

registration: { detector: sift, max_features: 4000, clahe: true, canonical_target_w: 1600,
                match_ratio: 0.75, ransac_reproj_px: 5.0, min_inliers: 15,
                roi: [0.21875, 0.0, 0.78125, 1.0] }
detection: { min_area_px: 40, max_area_px: 2400, morph_kernel: 3 }
slot_tracker:
  roi_size: 220
  min_tracked_for_active: 20
  min_tracked_ratio_for_active: 0.20
  near_anchor_radius_canonical_px: 120.0
tracking:
  max_gap_frames: 30
  gating_world_dist: 50.0
  process_noise: 1.0
  measurement_noise: 4.0
  # init-warmup: до приземления (~30c) не создаём треки в кромке карты
  # и игнорим слабые детекты — фикс для команд, "стартующих в углу".
  init_warmup_sec: 30.0
  init_reject_world_margin: 30.0
  init_min_score: 0.4

da_debug_near_miss: true
