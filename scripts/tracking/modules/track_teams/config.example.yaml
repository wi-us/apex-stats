# Каноническая карта (файлы в canonical_maps/<name>.png + .json)
canonical_map: storm_point

# Шаг между обрабатываемыми кадрами (камера обсервера двигается редко,
# можно смело брать большие значения — 300..600 при 60fps это 5..10 сек).
frame_step: 60

# Параметры регистрации кадра -> канонической карты
registration:
  detector: sift          # orb | sift (sift сильно лучше на кросс-домене карта<->VOD)
  max_features: 4000
  clahe: true             # выравнивание контраста перед детекцией
  canonical_target_w: 1600
  match_ratio: 0.75       # Lowe ratio test
  ransac_reproj_px: 5.0
  min_inliers: 15         # ниже -> кадр помечается low_confidence
  # ROI внутри кадра, где реально видна тактическая карта (нормализованные 0..1).
  # У обсервера карта квадратная ~1080x1080 по центру кадра 1920x1080.
  # (1920-1080)/2/1920 = 0.21875 -> 1-0.21875 = 0.78125
  roi: [0.21875, 0.0, 0.78125, 1.0]

# Команды и их HSV-диапазоны (как в /admin/hsv).
# Hue: 0..179, Sat: 0..255, Val: 0..255 (OpenCV convention).
teams:
  - id: red
    name: "Team Red"
    hsv_lower: [0, 160, 140]
    hsv_upper: [8, 255, 255]
    hsv_lower2: [172, 160, 140]   # red wraps around hue
    hsv_upper2: [179, 255, 255]
  - id: blue
    name: "Team Blue"
    hsv_lower: [100, 160, 140]
    hsv_upper: [120, 255, 255]
  - id: yellow
    name: "Team Yellow"
    hsv_lower: [22, 160, 160]
    hsv_upper: [34, 255, 255]
  - id: green
    name: "Team Green"
    hsv_lower: [55, 140, 120]
    hsv_upper: [78, 255, 255]

# Параметры детекции плашек
detection:
  min_area_px: 60
  max_area_px: 1200
  morph_kernel: 3
  arrow_min_area_px: 12
  arrow_approx_eps: 0.05

# Трекинг (в мировых координатах)
tracking:
  max_gap_frames: 30      # сколько кадров жить без детекции
  gating_world_dist: 50.0 # макс. расстояние в мире для ассоциации
  process_noise: 1.0
  measurement_noise: 4.0

# Выход
output:
  include_frame_px: true
  include_canonical_px: true

# Slot-tracker (ALGS-anchored). Уменьшаем «зону обнаружения», чтобы соседние
# команды с похожим цветом не слипались. При frame_step=60 (≈1 Гц) шаг гейта
# = v_max_px_s * 1s + gate_slack_px, и капается gate_cap_px.
slot_tracker:
  # Активация: первые N подряд кадров candidate должен лежать в этом радиусе
  # от POI-якоря. Уменьшаем со 120 → 80 px (≈4% от 2048).
  near_anchor_radius_canonical_px: 80
  min_consecutive_for_active: 3

  # Прогрессивный якорь: жёстко держим у POI первые 10 сек, затем за 30 сек
  # радиус линейно растёт до anchor_r_max.
  anchor_lock_sec: 10.0
  anchor_grow_sec: 30.0
  anchor_r_max: 130.0
  anchor_r0_fallback_canonical_px: 70.0

  # Защита от перепрыгивания на чужую плашку.
  jump_switch_threshold_px: 50.0
  switch_confirm_frames: 8

  motion:
    v_max_px_s: 45.0          # baseline скорости в canonical-пикселях/сек
    gate_slack_px: 10.0       # запас поверх v*dt
    gate_cap_px: 160.0        # ЖЁСТКИЙ потолок радиуса поиска (~8% карты)
    v_observed_boost: 1.2     # было 1.8 — меньше раздувание после случайных прыжков